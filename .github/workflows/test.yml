name: Build & Test

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 'Test: ${{ matrix.cfg.name }}'
    strategy:
      fail-fast: false
      matrix:
        include:
          - cfg: {name: 'Go 1.25 / Ubuntu x86_64', os: 'ubuntu-24.04', go: '1.25.x'}
          - cfg: {name: 'Go 1.26 / Ubuntu x86_64', os: 'ubuntu-24.04', go: '1.26.x'}
          - cfg: {name: 'Go 1.26 / Ubuntu ARM64', os: 'ubuntu-24.04-arm', go: '1.26.x'}
          - cfg: {name: 'Go 1.26 / macOS ARM64', os: 'macos-latest', go: '1.26.x'}
    runs-on: ${{ matrix.cfg.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ matrix.cfg.go }}
          cache-dependency-path: go.sum

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -timeout 60m ./...

  test-race:
    name: 'Full race detector'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.26.x'
          cache-dependency-path: go.sum

      - name: Run all tests with the race detector
        run: make test_unit_race

      - name: Stress lifecycle race regressions
        run: make test_lifecycle_race

  security:
    name: 'Vet and vulnerability scan'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.26.x'
          cache-dependency-path: go.sum

      - name: Vet
        run: go vet ./...

      - name: Scan reachable vulnerabilities
        run: go tool govulncheck ./...

      - name: Fuzz commitment parser
        run: go test ./crypto/commitments -run=^$ -fuzz=FuzzParseSecrets -fuzztime=10s

      - name: Fuzz wire parser
        run: go test ./tss -run=^$ -fuzz=FuzzParseWireMessage -fuzztime=10s
